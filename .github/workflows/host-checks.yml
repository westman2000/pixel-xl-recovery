name: Host checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run host tests (private-image reconstruction is skipped)
        run: python -m unittest discover -s tests -v
      - name: Check generated reader
        run: |
          python tools/render_docs.py
          python tools/render_docs.py --site
          git diff --exit-code -- READ-ME.html index.html
      - name: Verify distributed file hashes
        run: sha256sum --check SHA256SUMS
